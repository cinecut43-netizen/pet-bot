services:
  db:
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:16
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pet}
      POSTGRES_DB: pet
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build:
      context: .
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pet:${POSTGRES_PASSWORD:-pet}@db:5432/pet
      CACHE_DIR: /app/cache
    volumes:
      - render-cache:/app/cache
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  render-cache:
